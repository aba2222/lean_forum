{% if avatar_url %}
  <img
    src="{{ avatar_url }}"
    width="{{ size }}"
    height="{{ size }}"
    class="avatar-img rounded-circle"
    alt="{{ avatar_name }} 的头像"
    loading="lazy"
    decoding="async"
  />
{% else %}
  <span
    class="avatar-initial rounded-circle"
    role="img"
    aria-label="{{ avatar_name }} 的头像"
    style="width: {{ size }}px; height: {{ size }}px; background-color: {{ color }}; font-size: {{ font_size }}px;"
    >{{ initial }}</span
  >
{% endif %}
